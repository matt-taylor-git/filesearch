[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filesearch"
version = "0.1.0"
description = "A cross-platform file search application with extensible plugin architecture"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {text = "MIT"}
authors = [
    {name = "FileSearch Team", email = "team@filesearch.dev"}
]
keywords = ["file", "search", "gui", "cross-platform", "qt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = [
    "PyQt6>=6.6.0",
    "loguru>=0.7.2",
    "platformdirs>=4.0.0",
    "natsort",
    "qtawesome>=1.3.0",
    "send2trash>=1.8.0",
]

[project.optional-dependencies]
release = [
    "pyinstaller>=6.6.0",
    "pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0,<2.0",
    "pre-commit>=3.0.0",
    "psutil>=5.9.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-qt>=4.2.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.0",
    "types-Send2Trash>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/matt-taylor-git/filesearch"
Repository = "https://github.com/matt-taylor-git/filesearch"
Issues = "https://github.com/matt-taylor-git/filesearch/issues"

[project.scripts]
filesearch = "filesearch.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
filesearch = ["resources/icons/*"]

[tool.ruff]
extend-exclude = ["*.md"]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", # Pytest assertions are the test suite's verification mechanism.
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "-q",
    "--strict-config",
    "--strict-markers",
    "--timeout=30",
    "-m=not system and not performance",
    "--cov=filesearch",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-report=json:coverage.json",
]
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "ui: UI tests",
    "slow: Tests that take materially longer than the normal suite",
    "performance: Timing-sensitive performance tests excluded from required runs",
    "system: Tests that contact real operating-system desktop integrations",
]
filterwarnings = [
    "error",
]
qt_api = "pyqt6"

[tool.mypy]
python_version = "3.11"
files = ["src/filesearch"]
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true
